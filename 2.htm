	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
	<style>
		/* Premium Mobile Dock UI */
		#sc-ctrl {
			position: fixed;
			bottom: 24px;
			left: 50%;
			transform: translateX(-50%);
			width: 90%;
			max-width: 420px;
			background: rgba(20, 20, 25, 0.9);
			backdrop-filter: blur(16px);
			-webkit-backdrop-filter: blur(16px);
			border: 1px solid rgba(255, 255, 255, 0.1);
			border-radius: 30px;
			padding: 10px 16px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			z-index: 9999999;
			color: #fff;
			box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			user-select: none;
			-webkit-user-select: none;
			transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
		}

		#sc-ctrl.mini {
			width: 56px;
			border-radius: 50%;
			padding: 10px;
			left: calc(100% - 24px);
			transform: translateX(-100%);
			justify-content: center;
			bottom: 24px;
		}

		#sc-ctrl.mini>*:not(#sc-min-btn) {
			display: none !important;
		}

		#sc-ctrl.mini #sc-min-btn svg path {
			d: path("M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z");
		}

		.sc-btn {
			border-radius: 50%;
			border: none;
			display: flex;
			align-items: center;
			justify-content: center;
			cursor: pointer;
			-webkit-tap-highlight-color: transparent;
			transition: transform 0.2s, background 0.3s, box-shadow 0.3s;
		}

		.sc-btn:active {
			transform: scale(0.9);
		}

		#sc-switch-btn {
			width: 44px;
			height: 44px;
			background: #6366f1;
			/* Indigo */
			color: #fff;
			text-decoration: none;
			box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
		}

		#sc-play-btn {
			width: 56px;
			height: 56px;
			background: #10b981;
			/* Emerald */
			color: #fff;
			box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
		}

		#sc-play-btn.on {
			background: #ef4444;
			/* Red */
			box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
		}

		#sc-play-btn svg {
			width: 28px;
			height: 28px;
		}

		#sc-min-btn {
			width: 40px;
			height: 40px;
			background: transparent;
			color: rgba(255, 255, 255, 0.8);
		}

		.sc-speed-wrapper {
			display: flex;
			flex-direction: column;
			align-items: center;
			flex-grow: 1;
			margin: 0 16px;
		}

		#sc-speed {
			width: 100%;
			height: 8px;
			-webkit-appearance: none;
			appearance: none;
			background: rgba(255, 255, 255, 0.2);
			border-radius: 4px;
			outline: none;
			margin-bottom: 4px;
		}

		#sc-speed::-webkit-slider-thumb {
			-webkit-appearance: none;
			appearance: none;
			width: 24px;
			height: 24px;
			border-radius: 50%;
			background: #fff;
			box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
		}

		#sc-lbl {
			font-size: 13px;
			font-weight: 600;
			color: rgba(255, 255, 255, 0.9);
			letter-spacing: 0.5px;
		}

		/* For very small screens */
		@media (max-width: 380px) {
			#sc-ctrl {
				padding: 8px 12px;
				width: 95%;
			}

			#sc-switch-btn {
				width: 40px;
				height: 40px;
			}

			#sc-play-btn {
				width: 48px;
				height: 48px;
			}

			#sc-play-btn svg {
				width: 24px;
				height: 24px;
			}
		}
	</style>

	<div id="sc-ctrl">
		<!-- Switch Song Button -->
		<a href="1.html" id="sc-switch-btn" class="sc-btn" title="สลับเพลง">
			<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
				<path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z" />
			</svg>
		</a>

		<!-- Speed Slider -->
		<div class="sc-speed-wrapper">
			<input type="range" id="sc-speed" min="1" max="15" step="1" value="4">
			<span id="sc-lbl">ความเร็ว: 0.4</span>
		</div>

		<!-- Play/Pause Button -->
		<button id="sc-play-btn" class="sc-btn" onclick="_scToggle()">
			<svg id="sc-ico-play" viewBox="0 0 24 24" fill="currentColor">
				<path d="M8 5v14l11-7z" />
			</svg>
			<svg id="sc-ico-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none">
				<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
			</svg>
		</button>

		<!-- Minimize Button -->
		<button id="sc-min-btn" class="sc-btn" onclick="_scMin()">
			<svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
				<path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z" />
			</svg>
		</button>
	</div>

	<script>
		// Content Auto-Scaler for Mobile
		(function () {
			function fitContent() {
				var pc = document.getElementById('page-container');
				if (!pc) return; // Only apply to pdf2htmlEX container
				var ww = window.innerWidth;
				if (ww < 900) {
					var scale = ww / 900;
					pc.style.transform = 'scale(' + scale + ')';
					pc.style.transformOrigin = 'top left';
					// Adjust the body height so we can still scroll fully
					var totalHeight = pc.offsetHeight * scale;
					if (totalHeight > 0) {
						document.body.style.minHeight = totalHeight + 'px';
					}
				} else {
					pc.style.transform = 'none';
					document.body.style.minHeight = 'auto';
				}
			}
			window.addEventListener('resize', fitContent);
			window.addEventListener('load', fitContent);
			fitContent();
		})();

		// Scroll Controller Logic
		var _scPlaying = false, _scSpeed = 0.4, _scAcc = 0, _scLast = 0;
		function _scGetEl() {
			var p = document.getElementById('page-container');
			// For pdf2htmlEX with scaled container, scrolling body/html works better
			return document.scrollingElement || document.documentElement || p;
		}
		function _scStep(t) {
			if (!_scPlaying) return;
			if (!_scLast) { _scLast = t; requestAnimationFrame(_scStep); return; }

			// speed adjustments
			_scAcc += _scSpeed * ((t - _scLast) / 16.67);
			_scLast = t;

			var el = _scGetEl();
			if (el) {
				var prev = el.scrollTop;
				el.scrollTop = Math.floor(_scAcc);

				// Anti-stuck sync
				if (Math.abs(el.scrollTop - _scAcc) > 5) _scAcc = el.scrollTop;

				// Reached bottom
				if (el.scrollTop === prev && _scAcc > prev + 2) {
					_scToggle(); return;
				}
			}
			requestAnimationFrame(_scStep);
		}
		function _scToggle() {
			_scPlaying = !_scPlaying;
			var pb = document.getElementById('sc-play-btn');
			document.getElementById('sc-ico-play').style.display = _scPlaying ? 'none' : 'block';
			document.getElementById('sc-ico-pause').style.display = _scPlaying ? 'block' : 'none';
			if (_scPlaying) {
				pb.classList.add('on');
				_scLast = 0;
				var el = _scGetEl();
				if (el) _scAcc = el.scrollTop;
				requestAnimationFrame(_scStep);
			} else {
				pb.classList.remove('on');
			}
		}
		function _scMin() {
			var c = document.getElementById('sc-ctrl');
			c.classList.toggle('mini');
		}
		var _scSlider = document.getElementById('sc-speed');
		if (_scSlider) {
			_scSlider.addEventListener('input', function () {
				_scSpeed = parseInt(this.value) / 10;
				document.getElementById('sc-lbl').textContent = 'ความเร็ว: ' + _scSpeed.toFixed(1);
			});
		}
	</script>
	<!-- End Auto-Scroll Controller -->

</body>

</html>
